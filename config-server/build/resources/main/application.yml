server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/config-repo/
            - file:../config-repo/
            - file:./config-repo/
            - file:${user.dir}/config-repo/
            - file:${user.dir}/ss18/mini-project/config-repo/

management:
  endpoints:
    web:
      exposure:
        include: health,info
