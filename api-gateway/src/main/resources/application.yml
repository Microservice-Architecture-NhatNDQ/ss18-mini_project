server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # 1. Identity Service Routes (Auth)
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**

        # 2. Customer Service Routes
        - id: customer-service-customers
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: AuthenticationFilter

        - id: customer-service-staff
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/staff/**
          filters:
            - name: AuthenticationFilter

        - id: customer-service-account-types
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/account-types/**
          filters:
            - name: AuthenticationFilter

        # 3. Account Service Routes
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: AuthenticationFilter

        # 4. Transaction Service Routes
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/transfers/**
          filters:
            - name: AuthenticationFilter

        # 5. Notification Service Routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: AuthenticationFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
